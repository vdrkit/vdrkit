# VDRkit, self-hosted. Three steps:
#   1. Put this file, Caddyfile, docker/postgres-init, docker/backup and .env.example in one folder.
#   2. Copy .env.example to .env and fill it in.
#   3. docker compose up -d
#
# Upgrade: back up (`docker compose run --rm backup now`), set VDRKIT_TAG in .env, then
# `docker compose pull && docker compose up -d`. api and worker wait for migrate.
#
# Optional parts are Compose profiles, switched on in .env (COMPOSE_PROFILES, default "postgres,clamav"):
#   postgres  the bundled Postgres 17. Leave it out to use Neon or another server through DATABASE_URL.
#   clamav    the virus scanner. Scans files up to 1 GB and needs up to 3 GB of memory.
#   backup    daily backups of the database and the files volume into BACKUP_DIR. Needs VDRKIT_BACKUP_PASSWORD.

name: ${COMPOSE_PROJECT_NAME:-vdrkit}

# No shared env_file: each service gets only what it needs. Owner password: migrate only.
x-app: &app
  image: ${VDRKIT_IMAGE:-ghcr.io/vdrkit/vdrkit}:${VDRKIT_TAG:?Set VDRKIT_TAG in .env to the version to run, for example 1.0.0}
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

# Valueless entries pass through only when set in .env.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgres://vdrkit_app:${VDRKIT_APP_PASSWORD:-}@postgres:5432/vdrkit}
  QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:-postgres://vdrkit_queue:${VDRKIT_QUEUE_PASSWORD:-}@postgres:5432/vdrkit}
  VDRKIT_MASTER_KEY: ${VDRKIT_MASTER_KEY:-}
  SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
  PUBLIC_URL: ${PUBLIC_URL:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  GOTENBERG_URL: http://gotenberg:3000
  CLAMAV_HOST: ${CLAMAV_HOST-clamav}
  CLAMAV_PORT:
  # default 1 GiB; larger files stay unscanned (and are shown as such)
  CLAMAV_MAX_BYTES:
  DB_POOL_SIZE:
  VDRKIT_UPDATE_URL:

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      # direct connection, not a pooler: the migration lock is per connection
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://vdrkit_owner:${VDRKIT_OWNER_PASSWORD:-}@postgres:5432/vdrkit}
    networks: [default, db]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *backend-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      TRUST_PROXY:
      # source link for AGPL-3.0 s.13; set it if you run a modified copy
      VDRKIT_SOURCE_URL:
      PORT: "3001"
    volumes: [files:/data/storage]
    networks: [default, db, internal]
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    depends_on:
      migrate: { condition: service_completed_successfully }
    # keep at 1 until first-run setup is done: the setup code lives in one process
    deploy:
      replicas: ${API_REPLICAS:-1}

  worker:
    <<: *app
    command: ["worker"]             # pg-boss: process-version, notifications, reminders, health runs, purges
    environment:
      <<: *backend-env
      WORKER_TENANT_IDS:
      NOTIFY_CRON:
      REMINDER_CRON:
      HEALTH_CRON:
      PURGE_CRON:
    volumes: [files:/data/storage]
    networks: [default, db, internal]
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  web:
    <<: *app
    command: ["web"]
    environment:
      PORT: "3000"
      API_INTERNAL_URL: http://api:3001
      # for CSP connect-src only (no keys). CSP_CONNECT_SRC: extra origins, space-separated
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CSP_CONNECT_SRC:
    networks: [default]
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    depends_on:
      api: { condition: service_started }

  gotenberg:
    image: gotenberg/gotenberg:8.17.3
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s"]
    networks: [internal]            # reachable from the API and the worker only, no outbound access
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  clamav:
    profiles: [clamav]
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    # MaxFileSize matters: without it clamd says OK to files it never scanned.
    # Raise CLAMAV_MAX_BYTES only together with these; ClamAV can't scan over 2 GB.
    environment:
      CLAMD_CONF_StreamMaxLength: 1024M
      CLAMD_CONF_MaxFileSize: 1024M
      CLAMD_CONF_MaxScanSize: 2048M
      CLAMD_CONF_PCREMaxFileSize: 1024M
      CLAMD_CONF_MaxScanTime: "600000"
    # ~1 GB signatures, double during reloads; a 1 GB scan needs 1 GB free disk
    mem_limit: ${CLAMAV_MEMORY_LIMIT:-3g}
    networks: [default, internal]
    volumes: [clamav_db:/var/lib/clamav]
    logging: *logging

  proxy:
    image: caddy:2.9.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  postgres:
    profiles: [postgres]
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: vdrkit
      VDRKIT_OWNER_PASSWORD: ${VDRKIT_OWNER_PASSWORD:-}
      VDRKIT_APP_PASSWORD: ${VDRKIT_APP_PASSWORD:-}
      VDRKIT_QUEUE_PASSWORD: ${VDRKIT_QUEUE_PASSWORD:-}
      VDRKIT_BACKUP_PASSWORD: ${VDRKIT_BACKUP_PASSWORD:-}
    networks: [db]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ./docker/backup:/vdrkit-backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vdrkit"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # vdrkit_backup: reads everything, writes nothing
  #   docker compose run --rm backup now | list | verify NAME
  backup:
    profiles: [backup]
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "/vdrkit-backup/backup.sh"]
    command: ["daemon"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-postgres://vdrkit_backup:${VDRKIT_BACKUP_PASSWORD:-}@postgres:5432/vdrkit}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_RETRIES: ${BACKUP_RETRIES:-3}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-15}
      BACKUP_ON_START:
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - files:/data/storage
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/backup:/vdrkit-backup:ro
    networks: [default, db]
    healthcheck:
      test: ["CMD", "sh", "/vdrkit-backup/backup.sh", "health"]
      interval: 1h
      timeout: 10s
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy, required: false }
    logging: *logging

networks:
  db:
    internal: true
  internal:
    internal: true

volumes:
  pg_data:
  files:
  clamav_db:
  caddy_data:
  caddy_config:
